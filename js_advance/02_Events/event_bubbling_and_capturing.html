            <li><img width="200px" id="japan"

            <li><img width="200px" id="prayer"

        </ul>
    </div>
</body>

<!-- ═══════════════════════════════════════════════════════════════════════════
     JAVASCRIPT — EVENT BUBBLING & CAPTURING
     ═══════════════════════════════════════════════════════════════════════════

     Syntax: element.addEventListener(event, function, useCapture)
       - useCapture = false  → Bubbling  (default, inner → outer)
       - useCapture = true   → Capturing (outer → inner)
     ═══════════════════════════════════════════════════════════════════════════ -->

<script>

    // ═══════════════════════════════════════════════════════════════════════════
    //  ACTIVE CODE
    // ═══════════════════════════════════════════════════════════════════════════

    // --- Event Capturing demo (outer → inner) (Top → Bottom) ---
    // When you click the owl image, "Clicked on ul" prints FIRST, then "Clicked on owl".

    document.getElementById('images').addEventListener('click', (e) => {
        console.log(`Clicked on ul`);
    }, true);

    document.getElementById('owl').addEventListener('click', (e) => {
        console.log(`Clicked on owl`);
        // e.stopPropagation();   // Stops further propagation in both phases
    }, true);
